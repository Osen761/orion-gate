[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-gate"
version = "0.4.1"
description = "Open-source deterministic SQL AST and MCP firewall between AI agents and production SQL databases."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "Orion Gate Maintainers", email = "osenmuntu761@gmail.com" },
]
keywords = ["ai", "mcp", "sql", "firewall", "security", "postgres", "mysql", "bigquery", "multi-tenant", "sqlglot"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pandas>=2.2.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-jose[cryptography]>=3.3.0",
  "pyyaml>=6.0.0",
  "sqlglot>=25.0.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.10"]
mysql = ["sqlalchemy>=2.0.0", "pymysql>=1.1.0"]
bigquery = ["google-cloud-bigquery>=3.25.0", "google-auth>=2.35.0"]
redis = ["redis>=5.2.0"]
all = [
  "psycopg2-binary>=2.9.10",
  "sqlalchemy>=2.0.0",
  "pymysql>=1.1.0",
  "google-cloud-bigquery>=3.25.0",
  "google-auth>=2.35.0",
  "redis>=5.2.0",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
orion-gate = "orion_gate.cli:main"

[project.urls]
Homepage = "https://github.com/Osen761/orion-gate"
Repository = "https://github.com/Osen761/orion-gate"
Issues = "https://github.com/Osen761/orion-gate/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["orion_gate*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
