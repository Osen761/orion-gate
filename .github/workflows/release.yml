name: Release Orion Gate (PyPI + GHCR Docker + MCP Registry)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish package to PyPI (Trusted Publishing)"
        type: boolean
        default: true
      publish_docker:
        description: "Build and push multi-arch image to GHCR"
        type: boolean
        default: true
      publish_mcp:
        description: "Publish server.json to Official MCP Registry"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip build twine
          pip install -e ".[all,dev]"

      - name: Run full test suite (unit + adversarial attacks)
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python -m unittest discover -s tests/attacks -p "test_*.py" -v

      - name: Verify version consistency across pyproject.toml, server.json, and git tag
        id: meta
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          pkg_version = pyproject["project"]["version"]

          server = json.loads(Path("server.json").read_text(encoding="utf-8"))
          if server.get("version") != pkg_version:
              raise SystemExit(f"server.json version ({server.get('version')}) != pyproject.toml ({pkg_version})")
          for pkg in server.get("packages", []):
              if pkg.get("version") != pkg_version:
                  raise SystemExit(f"server.json package version ({pkg.get('version')}) != pyproject.toml ({pkg_version})")

          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          if os.environ.get("GITHUB_REF_TYPE") == "tag" and ref_name.startswith("v"):
              tag_version = ref_name.removeprefix("v")
              if tag_version != pkg_version:
                  raise SystemExit(f"Git tag ({ref_name}) != pyproject.toml version ({pkg_version})")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={pkg_version}\n")
          print(f"Verified release version: {pkg_version}")
          PY

      - name: Build sdist and wheel
        run: |
          python -m build
          twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orion-gate-dist
          path: dist/

  publish-pypi:
    needs: verify-and-build
    if: github.event_name == 'push' || inputs.publish_pypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/orion-gate
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: orion-gate-dist
          path: dist/

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-docker:
    needs: verify-and-build
    if: github.event_name == 'push' || inputs.publish_docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/osen761/orion-gate
          tags: |
            type=raw,value=${{ needs.verify-and-build.outputs.version }}
            type=raw,value=latest

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.gate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-mcp:
    needs:
      - verify-and-build
      - publish-pypi
    if: always() && needs.verify-and-build.result == 'success' && (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped') && (github.event_name == 'push' || inputs.publish_mcp)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher CLI
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin mcp-publisher
          mcp-publisher --version

      - name: Authenticate via GitHub OIDC and publish server.json
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
